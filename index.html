<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Detector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    padding: 12px;
    padding-bottom: 40px;
  }
  header {
    position: sticky;
    top: 0;
    background: #0d1117;
    padding: 8px 0 12px 0;
    z-index: 10;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  #updated { font-size: 0.75rem; color: #8b949e; }
  .filters {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .filter-btn {
    background: #161b22;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 0.8rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .filter-btn.active {
    background: #1f6feb;
    border-color: #1f6feb;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .symbol { font-size: 1.05rem; font-weight: 600; }
  .chain { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; margin-left: 6px; }
  .score { font-size: 1.1rem; font-weight: 700; }
  .reason { font-size: 0.82rem; color: #c9d1d9; margin-top: 6px; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
    font-size: 0.72rem;
    color: #8b949e;
  }
  .meta span { background: #0d1117; padding: 2px 8px; border-radius: 6px; }
  .link-btn {
    display: inline-block;
    margin-top: 10px;
    background: #21262d;
    border: 1px solid #30363d;
    color: #58a6ff;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.78rem;
  }
  .empty { text-align: center; color: #8b949e; padding: 40px 0; }
  .disclaimer {
    font-size: 0.72rem;
    color: #8b949e;
    text-align: center;
    margin-top: 20px;
    padding: 0 10px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<header>
  <h1>🚨 Crypto Early Detector</h1>
  <div id="updated">Cargando...</div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="🟢">🟢 Verde</button>
    <button class="filter-btn" data-filter="🟡">🟡 Amarillo</button>
    <button class="filter-btn" data-filter="🔴">🔴 Rojo</button>
  </div>
</header>

<div id="content"></div>

<div class="disclaimer">
  ⚠️ Esto es una herramienta de filtrado, no una recomendación de inversión.
  Verifica siempre manualmente antes de operar: contrato, liquidez bloqueada,
  distribución de holders y equipo.
</div>

<script>
let allTokens = [];
let currentFilter = "all";

async function loadData() {
  try {
    const res = await fetch('latest_scan.json?t=' + Date.now()); // cache-bust
    const data = await res.json();
    allTokens = data.tokens || [];

    const updated = new Date(data.updated_at);
    document.getElementById('updated').textContent =
      'Actualizado: ' + updated.toLocaleString('es-CL', { dateStyle: 'short', timeStyle: 'short' });

    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="empty">No se pudo cargar el último escaneo.<br>Revisa que GitHub Pages esté activo y que ya haya corrido al menos un ciclo.</div>';
  }
}

function render() {
  const container = document.getElementById('content');
  let tokens = allTokens;

  if (currentFilter !== "all") {
    tokens = tokens.filter(t => t.semaphore === currentFilter);
  }

  // Ordenar por score descendente
  tokens = [...tokens].sort((a, b) => b.score - a.score);

  if (tokens.length === 0) {
    container.innerHTML = '<div class="empty">No hay candidatos con este filtro en el último ciclo.</div>';
    return;
  }

  container.innerHTML = tokens.map(t => `
    <div class="card">
      <div class="card-top">
        <div><span class="symbol">${escapeHtml(t.symbol)}</span><span class="chain">${escapeHtml(t.chain)}</span></div>
        <div class="score">${t.semaphore} ${t.score.toFixed(1)}</div>
      </div>
      <div class="reason">${t.reasons && t.reasons.length ? escapeHtml(t.reasons[0]) : 'Sin señales destacadas'}</div>
      <div class="meta">
        ${t.age_hours != null ? `<span>⏱ ${formatAge(t.age_hours)}</span>` : ''}
        ${t.liquidity_usd != null ? `<span>💧 $${formatNum(t.liquidity_usd)}</span>` : ''}
        ${t.market_cap != null ? `<span>📊 MC $${formatNum(t.market_cap)}</span>` : ''}
        ${t.price_change_24h != null ? `<span>${t.price_change_24h >= 0 ? '📈' : '📉'} ${t.price_change_24h.toFixed(0)}% (24h)</span>` : ''}
      </div>
      ${t.url ? `<a class="link-btn" href="${escapeHtml(t.url)}" target="_blank" rel="noopener">Ver en DexScreener →</a>` : ''}
    </div>
  `).join('');
}

function formatAge(hours) {
  if (hours < 1) return Math.round(hours * 60) + ' min';
  return hours.toFixed(1) + 'h';
}

function formatNum(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(0) + 'K';
  return n.toFixed(0);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

loadData();
// Recarga automática cada 2 minutos, por si dejas la página abierta
setInterval(loadData, 2 * 60 * 1000);
</script>

</body>
</html>
