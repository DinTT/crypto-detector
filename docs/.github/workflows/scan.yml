name: Crypto Scanner

on:
  schedule:
    # Cada 5 minutos — el mínimo práctico de GitHub Actions. Repo público =
    # minutos de Actions ilimitados, así que no tiene costo extra.
    # GitHub Actions SIGUE sin garantizar exactitud al minuto en cron
    # (puede haber retrasos de algunos minutos en horas de alta carga).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesario para commitear seen_tokens.json actualizado
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar escaneo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py

      - name: Guardar resultados actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_tokens.json docs/latest_scan.json
          if git diff --staged --quiet; then
            echo "Sin cambios, nada que commitear."
            exit 0
          fi
          git commit -m "Update scan results [skip ci]"

          # Reintenta con pull --rebase por si hay una carrera con otro push
          # (ej. el usuario subiendo cambios al mismo tiempo que corre este workflow).
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Push exitoso en intento $i"
              exit 0
            fi
            echo "Intento $i falló, reintentando en unos segundos..."
            sleep $(( (RANDOM % 10) + 5 ))
          done

          echo "No se pudo subir los resultados tras varios intentos."
          exit 1
